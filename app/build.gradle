apply plugin: 'com.android.application'

android {
    namespace 'com.dani.modder'
    compileSdk 33

    defaultConfig {
        applicationId 'com.dani.modder'
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
